[package]
name = "vgonio-app"
authors.workspace = true
edition.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "vgn_app"
path = "src/main.rs"

# `FitOptions` is only exported under the `fitting` feature; skip this test
# target entirely when the feature is off instead of failing to compile.
[[test]]
name = "cmd_fit_tests"
path = "tests/cmd_fit_tests.rs"
required-features = ["fitting"]

[[test]]
name = "vgmo_round_trip"
path = "tests/vgmo_round_trip.rs"
required-features = ["test-support"]

[[test]]
name = "vgbsdf_multi_level"
path = "tests/vgbsdf_multi_level.rs"
required-features = ["test-support"]

[features]
default = ["dep:embree", "dep:vgn_bxdf", "vgn_bxdf/io"]
embree = ["dep:embree", "vgn_io/embree"]
optix = []
bench = ["vgn_io/bench"]
fitting = ["dep:vgn_bxdf", "vgn_bxdf/fitting"]
surf-obj = ["vgn_io/surf-obj"]
surf-gen = ["vgn_io/surf-gen"]
vdbg = []
vvdbg = []
cuda = ["vgn_core/cuda", "vgn_bxdf/cuda"]
# Exposes test-only constructors and makes the `io` codec module public so integration tests can drive it.
test-support = []

[dependencies]
bytes.workspace = true
chrono.workspace = true
clap.workspace = true
egui.workspace = true
egui_dock.workspace = true
egui_extras.workspace = true
egui-file-dialog.workspace = true
egui-winit.workspace = true
egui-gizmo.workspace = true
egui_plot.workspace = true
egui-toast.workspace = true
embree = { workspace = true, optional = true }
env_logger.workspace = true
exr.workspace = true
flate2.workspace = true
log.workspace = true
lz4_flex.workspace = true
rand.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
uuid.workspace = true
approx.workspace = true
bincode.workspace = true
bytemuck.workspace = true
dirs.workspace = true
futures-intrusive.workspace = true
image.workspace = true
levenberg-marquardt.workspace = true
numpy.workspace = true
nalgebra.workspace = true
pollster.workspace = true
pyo3.workspace = true
rand_chacha.workspace = true
static_assertions.workspace = true
toml.workspace = true
type-map.workspace = true
winit.workspace = true
wgpu.workspace = true
vgn_io.workspace = true
vgn_jabr.workspace = true
vgn_uxgx = { workspace = true, features = ["gfx", "gui"] }
vgn_core = { workspace = true, features = ["cli", "winit", "io", "config"] }
vgn_bxdf = { workspace = true, optional = true, features = ["fitting", "io"] }
vgonio-job-api = { path = "../vgonio-job-api" }
vgonio-executor = { path = "../vgonio-executor" }

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true
tempfile.workspace = true
zip.workspace = true

[lints]
workspace = true
