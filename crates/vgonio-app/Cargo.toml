[package]
name = "vgonio-app"
authors.workspace = true
edition.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "vgn_app"
path = "src/main.rs"

# `FitOptions` is only exported under the `fitting` feature; skip this test
# target entirely when the feature is off instead of failing to compile.
[[test]]
name = "cmd_fit_tests"
path = "tests/cmd_fit_tests.rs"
required-features = ["fitting"]

[[test]]
name = "vgmo_round_trip"
path = "tests/vgmo_round_trip.rs"
required-features = ["test-support"]

[[test]]
name = "vgbsdf_multi_level"
path = "tests/vgbsdf_multi_level.rs"
required-features = ["test-support"]

[features]
default = []
# Backends are pulled via the sub-crates (DIST Task 2.8/2.9); the app selects
# real-vs-null at `build_local_executor` time per these flags.
embree = ["dep:vgonio-measurement-embree"]
wgpu = ["dep:vgonio-measurement-wgpu"]
# `cuda` is a fitting/plot build-mode flag in Phase 2 (no measurement backend);
# it lights vgn_bxdf's CUDA paths directly (cmd_plot.rs gates on the app's own
# `cuda`), and forwards into vgonio-fitting when that capability is enabled.
cuda = ["vgn_bxdf/cuda", "vgonio-fitting?/cuda"]
fitting = ["dep:vgonio-fitting", "vgn_bxdf/fitting"]
# Propagate build-mode flags into every enabled backend sub-crate (weak `?/`).
vdbg = ["vgonio-measurement/vdbg", "vgonio-measurement-embree?/vdbg", "vgonio-measurement-wgpu?/vdbg"]
vvdbg = ["vgonio-measurement/vvdbg", "vgonio-measurement-embree?/vvdbg", "vgonio-measurement-wgpu?/vvdbg"]
bench = ["vgn_io/bench", "vgonio-measurement/bench", "vgonio-measurement-embree?/bench"]
surf-obj = ["vgn_io/surf-obj"]
surf-gen = ["vgn_io/surf-gen"]
# Exposes test-only constructors + the `io` codec module for integration tests.
test-support = ["vgonio-measurement/test-support"]

[dependencies]
bytes.workspace = true
chrono.workspace = true
clap.workspace = true
ctrlc = "3"
egui.workspace = true
egui_dock.workspace = true
egui_extras.workspace = true
egui-file-dialog.workspace = true
egui-winit.workspace = true
egui-gizmo.workspace = true
egui_plot.workspace = true
egui-toast.workspace = true
env_logger.workspace = true
exr.workspace = true
flate2.workspace = true
log.workspace = true
lz4_flex.workspace = true
rand.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
uuid.workspace = true
approx.workspace = true
bincode.workspace = true
bytemuck.workspace = true
dirs.workspace = true
futures-intrusive.workspace = true
image.workspace = true
levenberg-marquardt.workspace = true
numpy.workspace = true
nalgebra.workspace = true
pollster.workspace = true
pyo3.workspace = true
rand_chacha.workspace = true
static_assertions.workspace = true
toml.workspace = true
type-map.workspace = true
winit.workspace = true
wgpu.workspace = true
vgn_io.workspace = true
vgn_jabr.workspace = true
vgn_uxgx = { workspace = true, features = ["gfx", "gui"] }
vgn_core = { workspace = true, features = ["cli", "winit", "io", "config"] }
vgn_bxdf = { workspace = true, features = ["fitting", "io"] }
vgonio-fitting = { path = "../vgonio-fitting", optional = true }
vgonio-job-api = { path = "../vgonio-job-api" }
vgonio-executor = { path = "../vgonio-executor" }
vgonio-measurement = { path = "../vgonio-measurement" }
vgonio-measurement-embree = { path = "../vgonio-measurement-embree", optional = true }
vgonio-measurement-wgpu = { path = "../vgonio-measurement-wgpu", optional = true }

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true
tempfile.workspace = true
zip.workspace = true

[lints]
workspace = true
