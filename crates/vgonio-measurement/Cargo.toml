[package]
name = "vgonio-measurement"
authors.workspace = true
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "vgn_measurement"

[features]
default = []
vdbg = []
vvdbg = []
bench = []
test-support = []

[dependencies]
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
log.workspace = true
rayon.workspace = true
chrono.workspace = true
nalgebra.workspace = true
rand.workspace = true
rand_chacha.workspace = true
exr.workspace = true                                                # NDF/SDF/BSDF EXR writers
flate2.workspace = true                                             # VGMO codec (Zlib/Gzip)
lz4_flex.workspace = true                                           # VGMO codec (Lz4)
approx.workspace = true                                             # measurement test asserts
tempfile.workspace = true
futures-intrusive.workspace = true
static_assertions.workspace = true
vgn_core = { workspace = true, features = ["io", "config", "cli"] }
vgn_io.workspace = true
vgn_jabr.workspace = true
vgn_bxdf = { workspace = true, features = ["io"] }
vgonio-job-api = { path = "../vgonio-job-api" }
vgonio-executor = { path = "../vgonio-executor" }

[dev-dependencies]
zip.workspace = true                                                # vgsdf archive smoke tests

[lints]
workspace = true
