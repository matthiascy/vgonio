[package]
name = "vgonio-core"
description = "Core types, traits, and functionalities for vgonio"
authors.workspace = true
edition.workspace = true
version.workspace = true

[features]
default = []
use_f64 = []
pybind = ["dep:pyo3"]
config = ["dep:dirs", "dep:toml", "serde"]
cli = ["dep:clap", "dep:env_logger"]
winit = ["dep:winit"]
fitting_api = ["bxdf_fitting_api", "mdf_fitting_api"]
bxdf_fitting_api = []
mdf_fitting_api = []

io = ["dep:exr", "dep:serde_json", "dep:serde-pickle"]
serde = ["dep:serde"]
timing = []

# Features for the bxdf module
bxdf = ["dep:libm", "powitacq"]
bxdf-fitting = ["bxdf", "dep:levenberg-marquardt", "dep:nalgebra", "dep:rayon"]

# Features for the surface module
surface = ["dep:nohash-hasher"]
surface-gen = ["surface"]
surface-obj = ["surface", "dep:tobj", "dep:ahash"]
surface-exr = ["surface", "dep:exr"]

# Features for the measure module
measure = ["surface", "bxdf", "config", "dep:rayon", "dep:serde", "dep:serde_yaml"]
measure-vdbg = ["measure", "dep:env_logger"]
measure-vvdbg = ["measure"]
measure-mfd = ["measure"]
measure-bxdf = ["measure", "bxdf"]
measure-bxdf-embree = ["measure-bxdf", "dep:embree"]
measure-bxdf-optix = ["measure-bxdf"]

[dependencies]
# Shared dependencies
approx.workspace = true
byteorder.workspace = true
cfg-if.workspace = true
chrono.workspace = true
clap = { workspace = true, optional = true }
csv = { workspace = true }
dirs = { workspace = true, optional = true }
env_logger = { workspace = true, optional = true }
exr = { workspace = true, optional = true }
flate2.workspace = true
glam.workspace = true
indicatif.workspace = true
lazy_static.workspace = true
log.workspace = true
num-traits.workspace = true
paste.workspace = true
rand.workspace = true
rand_chacha.workspace = true
serde = { workspace = true, optional = true }
thiserror.workspace = true
toml = { workspace = true, optional = true }
static_assertions.workspace = true
uuid.workspace = true
winit = { workspace = true, optional = true }
pyo3 = { workspace = true, optional = true, features = ["extension-module"] }
vgonio-jabr = { package = "vgonio-jabr", path = "../vgonio-jabr" }

embree = { workspace = true, optional = true }

# Dependencies specific to bxdf module
libm = { workspace = true, optional = true }
levenberg-marquardt = { workspace = true, optional = true }
nalgebra = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
serde-pickle = { workspace = true, optional = true }
powitacq = { package = "vgonio-powitacq", path = "../../libs/vgonio-powitacq", optional = true }

# Dependencies specific to surface module
ahash = { workspace = true, optional = true }
tobj = { workspace = true, optional = true }
nohash-hasher = { workspace = true, optional = true }

# Dependencies specific to measure module
serde_yaml = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
serde_yaml.workspace = true
env_logger.workspace = true
