[package]
name = "vgonio-io"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Library for manipulating, reading and writing micro-surfaces."

[features]
default = []
bench = []
embree = ["dep:embree"]
surf-gen = []
surf-obj = ["dep:tobj", "dep:ahash"]
pybind = ["dep:pyo3"]

[lib]
name = "vgn_io"
crate-type = ["cdylib", "rlib"]

[dependencies]
byteorder.workspace = true
chrono.workspace = true
clap.workspace = true
exr.workspace = true
flate2.workspace = true
glam.workspace = true
log.workspace = true
nohash-hasher.workspace = true
rand.workspace = true
rayon.workspace = true
serde.workspace = true
tempfile.workspace = true
toml.workspace = true
uuid.workspace = true
zip.workspace = true

ahash = { workspace = true, optional = true }
embree = { workspace = true, optional = true }
pyo3 = { workspace = true, optional = true }
tobj = { workspace = true, optional = true }
vgn_core = { workspace = true, features = ["io"] }
